<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="game.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">  
  <link href="http://fonts.cdnfonts.com/css/machine-gunk" rel="stylesheet">
</head>

  <body>
    <h1>It's Pokemon, START!</h1>
    
    <div class="game"><main class="map">
      <div class="container grid"></div>
    </main>
    <script src="game.js"></script>
    
    <div class="info">
      <button onclick="startChr();" class="start">Start</button>
      <div class="infoBox"></div>
      <p>Score: <span class="score">0<span></p>
      <p>Timer: <div id="time" style="font-size:21px; font-weight:800;">0:0</div></p>
      <div class="table">
        <p>TopScore:</p>
        <p class="highScore"></p>
      </div>
    </div>
  </body>
</html>
