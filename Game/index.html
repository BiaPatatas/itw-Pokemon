<!DOCTYPE html>
<html>
  <head>
    <title>Hello!</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <style>
    body{
    background: radial-gradient(ellipse at center, rgba(240,249,255,1) 0%,rgba(203,235,255,1) 25%,rgba(161,219,255,1) 100%);
    }
    
    .grid-item {
      padding: 1em;
      border: 1px solid white;
      text-align: center;
      background-color:yellowgreen;
      box-shadow: 8px 8px grey;
    }
  
    .game {
      text-align: center;
      justify-content: center;
      margin: 10px auto 30px auto;
      height: 300px;
      width: 900px;
      padding: 20px;
      display: flex;
      justify-content: space-between;
    }

    .score {
      color: white;
      font-weight: bold;
    }
    .info {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      align-content: center;
      width: 35%
    }
  
    .infoBox {
      height: 10%;
    }
  
    .start {
      color: white;
      font-family: 'Press Start 2P', cursive;
      font-size: 20px;
      padding: 25px 5px;
      width: 80%;
      background-color: red;
      box-shadow: 5px 5px 0 white;
      border-color: white;
      
    }
    .start:active {
      top: 5px;
      box-shadow: none;
      margin-top: 5px;
      margin-left: 5px;
      margin-bottom: -5px;
    }
    .info > p {
      margin: 10px auto;
      font-family: 'Press Start 2P', cursive;
      height: 5%;
      font-size: 20px;
      text-shadow: slategray 3px 2px;
    }
  
    p {
    color: white;
    font-weight: bold;
  }
  
  .timer {
    color: white;
    font-weight: bold;
    font-size: 20px;
  }
  
  h1 {
    text-align: center;
    margin-top: 30px;
    color: rgba(255, 255, 0, 0.877);
    font-family: 'Press Start 2P', cursive;
    font-size: 40px;
    text-shadow:3px 2px whitesmoke;
  }
  
  .table{
    border: 2px solid white;
    width: 80%;
    font-family: 'Press Start 2P', cursive;
    margin-top: 30px;
    font-size: 20px;
    
  }
  .table > p {
    font-family: 'Press Start 2P', cursive;
    color: white;
  }

  * {
    box-sizing: border-box;
  }
  

  
  .page-wrapper {
    max-width: 960px;
    padding: 1rem;
    margin: 0 auto;
  }
  
  strong {
    font-weight: 700;
  }
  
  
  code {
    font-family: 'Inconsolata', monospace;
  }
  
  .character {
    position: absolute; 
    width: 100px; 
    height: 100px;
    background-image: url("../imagens/personagem1.png");
    
  }
  
  .rock {
    position: absolute;
    width: 100px;
    height: 100px;
    background-image: url(rock.svg);
  }
  
  .plant {
    position: absolute;
    width: 100px;
    height: 100px;
    background-image: url(plant.svg);
  }
  
  .win-message {
    position: absolute;
    width: 500px;
    top: 150px;
    background-color: rgba(255,255,255,0.75);
    font-family: 'Inconsolata', monospace;
    text-align: center;
    font-weight: 700;
    font-size: 4rem;
  }
  </style>
  <body>

    <body>
      <h1>START PLAY NOW!!!</h1>
    <div class="game"><main class="map">
      <div class="container grid"></div>
    </main>
    

      <div class="board" style="position: relative; background-color:yellowgreen; height: 500px; width: 500px; margin: 0 auto 1rem; box-shadow: 8px 8px grey;">
        <div class="character"></div>
 
     </div>

     <div class="info">
      <div class="infoBox"></div>
      <p>Score: <span class="score">0<span></p>
      <p>Timer: <div id="time" style="font-size:21px; font-weight:800;">0:0</div></p>
      <div class="table">
        <p>TopScore:</p>
        <p class="highScore"></p>
      </div>
    </div>
  </body>
</html>
